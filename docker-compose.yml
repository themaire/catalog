services:
  db:
    image: mariadb:10.11
    container_name: catalog-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD manquant dans .env}
      MARIADB_DATABASE: ${DB_NAME:-lib3d}
      MARIADB_USER: ${DB_USER:-catalog}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
      TZ: Europe/Paris
    volumes:
      - db-data:/var/lib/mysql
      - ./lib3d_bdd.sql:/docker-entrypoint-initdb.d/01-lib3d_bdd.sql:ro
    # Exposé uniquement en local sur l'hôte (debug / client mysql) ; le backend passera par le réseau compose.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build: ./modern/backend
    container_name: catalog-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-lib3d}
      DB_USER: ${DB_USER:-catalog}
      DB_PASSWORD: ${DB_PASSWORD}
      SCAN_CRON: ${SCAN_CRON:-*/10 * * * *}
      SCAN_NEW_CATEGORY_LEVEL: ${SCAN_NEW_CATEGORY_LEVEL:-1}
      TZ: Europe/Paris
    volumes:
      # Lecture seule : le backend ne modifie jamais les modèles, il extrait dans le cache.
      - ${MODELS_DIR:-./modeles}:/data/models:ro
      - extract-cache:/cache
    # Accès direct à l'API pour debug, local uniquement (le LAN passe par le frontend).
    # Pas 3000 : déjà pris par Grafana sur piserve.
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-3080}:3000"

  frontend:
    build: ./modern/frontend
    container_name: catalog-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Exposé sur le LAN
    ports:
      - "${FRONTEND_PORT:-8090}:80"

volumes:
  db-data:
  extract-cache:
