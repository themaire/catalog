# Seul le frontend est publié sur le réseau. Pour accéder aussi à MariaDB et à l'API depuis l'hôte :
#   docker compose -f docker-compose.yml -f docker-compose.debug.yml up -d
services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD manquant dans .env}
      MARIADB_DATABASE: ${DB_NAME:-lib3d}
      MARIADB_USER: ${DB_USER:-catalog}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
      TZ: Europe/Paris
    volumes:
      - db-data:/var/lib/mysql
      - ./lib3d_bdd.sql:/docker-entrypoint-initdb.d/01-lib3d_bdd.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build: ./modern/backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-lib3d}
      DB_USER: ${DB_USER:-catalog}
      DB_PASSWORD: ${DB_PASSWORD}
      SCAN_CRON: ${SCAN_CRON:-*/10 * * * *}
      SCAN_NEW_CATEGORY_LEVEL: ${SCAN_NEW_CATEGORY_LEVEL:-1}
      TZ: Europe/Paris
    volumes:
      # Lecture seule : le backend ne modifie jamais les modèles, il extrait dans le cache.
      - ${MODELS_DIR:-./modeles}:/data/models:ro
      - extract-cache:/cache
      # Emplacements de l'hôte que l'assistant peut explorer pour choisir le dossier des modèles
      # (lecture seule). rslave : un disque USB monté après le démarrage apparaît quand même.
      - { type: bind, source: /media, target: /host/media, read_only: true, bind: { propagation: rslave } }
      - { type: bind, source: /mnt, target: /host/mnt, read_only: true, bind: { propagation: rslave } }
      - { type: bind, source: /home, target: /host/home, read_only: true }

  frontend:
    build: ./modern/frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Exposé sur le LAN
    ports:
      - "${FRONTEND_PORT:-8090}:80"

volumes:
  db-data:
  extract-cache:
